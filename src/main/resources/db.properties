# ============================================================
#  数据库配置：数据库名 DateTest
# ============================================================

# -------- 【默认】H2 嵌入式数据库（MySQL 兼容模式），开箱即用，无需安装 --------
db.driver=org.h2.Driver
db.url=jdbc:h2:mem:DateTest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
db.username=sa
db.password=

# -------- 【可选】切换为 MySQL：注释掉上面的配置，启用下面的配置 --------
# 1) 先在 MySQL 中执行建库脚本：CREATE DATABASE DateTest DEFAULT CHARSET utf8mb4;
# 2) 再执行建表脚本 schema.sql
# 3) 修改下面的账号密码后启用
#
# db.driver=com.mysql.cj.jdbc.Driver
# db.url=jdbc:mysql://localhost:3306/DateTest?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
# db.username=root
# db.password=123456
